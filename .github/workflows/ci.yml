name: Fast PR

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-pr:
    name: Fast contracts and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CI_DISK_BUDGET_BYTES: "4294967296"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Initialize isolated build root and cost clock
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target-fast-pr" >> "$GITHUB_ENV"
          echo "CI_COST_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Show toolchain
        run: rustc --version && cargo --version
      - name: Check formatting and JSON schemas
        run: |
          cargo fmt --all -- --check
          jq empty cases/registry.json schemas/*.json transfer-syntax/*.json standards.lock.json
          python3 scripts/check-test-ownership.py
          python3 -m unittest tests/test_test_ownership_checker.py
          python3 -m unittest tests/test_change_test_routing.py
      - name: Compile public library and CLI with warnings denied
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked --no-default-features --lib --bins
      - name: Run light contract and domain tests
        run: |
          cargo test --locked --no-default-features \
            --test schema_resources__fast --test release_ci__fast
      - name: Run routed ordinary subsystem bundles
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base=$PR_BASE_SHA ;;
            push) base=$PUSH_BEFORE_SHA ;;
            workflow_dispatch) base=0000000000000000000000000000000000000000 ;;
            *) echo "unsupported Fast routing event: $EVENT_NAME" >&2; exit 2 ;;
          esac
          python3 scripts/route-changed-tests.py --diff "$base" "$HEAD_SHA"
      - name: Generate and validate tiny smoke corpus
        run: |
          started=$SECONDS
          root="$RUNNER_TEMP/synth-dicom-gen-fast-smoke"
          cargo run --locked --no-default-features -- generate --profile smoke --out "$root" --seed 1
          cargo run --locked --no-default-features -- validate "$root"
          echo "fast_pr_elapsed_seconds=$((SECONDS - started))"
          echo "output_bytes=$(du -sk "$root" | awk '{print $1 * 1024}')"
          echo "output_artifact_count=$(find "$root" -type f | wc -l | tr -d ' ')"
      - name: Report and enforce Fast build cost
        if: always()
        env:
          CI_COST_ENFORCE: ${{ job.status == 'success' && '1' || '0' }}
        run: scripts/report-ci-cost.sh fast-pr "$CI_DISK_BUDGET_BYTES" "$CARGO_TARGET_DIR" "$RUNNER_TEMP/synth-dicom-gen-fast-smoke"
