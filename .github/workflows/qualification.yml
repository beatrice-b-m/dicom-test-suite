name: Heavy qualification

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      qualification_class:
        description: Broad nightly or immutable release-candidate qualification
        required: true
        type: choice
        default: nightly
        options:
          - nightly
          - release-candidate
      candidate_revision:
        description: Required 40-hex commit for release-candidate; blank uses the dispatched revision for nightly
        required: false
        type: string

concurrency:
  group: qualification-${{ github.event_name == 'schedule' && format('nightly-{0}', github.ref) || format('{0}-{1}', inputs.qualification_class, inputs.candidate_revision || github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selection:
    name: Resolve qualification class and immutable revision
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CI_DISK_BUDGET_BYTES: "1073741824"
    outputs:
      class: ${{ steps.selection.outputs.class }}
      revision: ${{ steps.selection.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
      - name: Initialize isolated build root and cost clock
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target-selection" >> "$GITHUB_ENV"
          echo "CI_COST_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Validate explicit selection
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_CLASS: ${{ inputs.qualification_class }}
          CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
          TRIGGER_REVISION: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = schedule ]; then
            class=nightly
            revision="$TRIGGER_REVISION"
          elif [ "$REQUESTED_CLASS" = nightly ]; then
            class=nightly
            revision="$TRIGGER_REVISION"
            if [ -n "$CANDIDATE_REVISION" ]; then
              echo "candidate_revision is valid only for release-candidate qualification" >&2
              exit 2
            fi
          elif [ "$REQUESTED_CLASS" = release-candidate ]; then
            class=release-candidate
            revision="$CANDIDATE_REVISION"
            if ! printf '%s' "$revision" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "release-candidate qualification requires an immutable 40-hex commit" >&2
              exit 2
            fi
          else
            echo "unsupported qualification class: $REQUESTED_CLASS" >&2
            exit 2
          fi
          echo "class=$class" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "qualification_class=$class immutable_revision=$revision"
      - name: Check out selected revision
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.selection.outputs.revision }}
      - name: Prove selected revision
        env:
          EXPECTED_REVISION: ${{ steps.selection.outputs.revision }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - name: Report selection cost
        if: always()
        env:
          CI_COST_ENFORCE: ${{ job.status == 'success' && '1' || '0' }}
        run: scripts/report-ci-cost.sh selection "$CI_DISK_BUDGET_BYTES" "$CARGO_TARGET_DIR"

  native-provider-contract:
    name: Native provider contract
    needs: selection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CI_DISK_BUDGET_BYTES: "6442450944"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.selection.outputs.revision }}
      - name: Initialize isolated build root and cost clock
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target-native-provider" >> "$GITHUB_ENV"
          echo "CI_COST_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Prepare locked generation backend
        run: |
          uv python install 3.12.12
          uv sync --project generation-backends/highdicom-pydicom --locked --no-editable --compile-bytecode --python 3.12.12
          echo "DTS_HIGHDICOM_PYTHON=$PWD/generation-backends/highdicom-pydicom/.venv/bin/python" >> "$GITHUB_ENV"
      - name: Verify cancellation and strict provider contracts
        env:
          RUST_TEST_THREADS: "1"
        run: |
          cargo test --locked --no-default-features --lib \
            generation_backends::process::tests::fake_backend_timeout_is_enforced \
            -- --ignored --exact
          cargo test --locked --no-default-features --lib \
            generation_backends::process::tests::fake_backend_cancellation_interrupts_fingerprinting_promptly \
            -- --ignored --exact
          cargo test --locked --no-default-features --lib \
            generation_backends::process::tests::fake_backend_cancellation_kills_and_reaps_a_spawned_process_tree_promptly \
            -- --ignored --exact
          cargo test --locked --no-default-features --lib \
            generation_backends::process::tests::fake_backend_inherited_pipe_timeout_is_enforced \
            -- --ignored --exact
          cargo test --locked --no-default-features --test composition__subsystem \
            composition_curated_migration::migrated_curated_recipes_record_shared_plan_materialization -- --ignored --exact
          cargo test --locked --no-default-features --test composition__subsystem \
            composition_quantitative::quantitative_default_bundles_are_closed_provenanced_and_reproducible -- --ignored --exact
          cargo test --locked --no-default-features --test composition__subsystem \
            composition_quantitative::caller_segmentation_and_parametric_values_round_trip_at_fixed_shape -- --ignored --exact
      - name: Report and enforce provider build cost
        if: always()
        env:
          CI_COST_ENFORCE: ${{ job.status == 'success' && '1' || '0' }}
        run: scripts/report-ci-cost.sh subsystem-provider "$CI_DISK_BUDGET_BYTES" "$CARGO_TARGET_DIR"

  default:
    name: Default corpus
    needs: [selection, native-provider-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CI_DISK_BUDGET_BYTES: "12884901888"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.selection.outputs.revision }}
      - name: Initialize isolated build root and cost clock
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target-nightly-default" >> "$GITHUB_ENV"
          echo "CI_COST_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Prepare locked generation backend
        run: |
          uv python install 3.12.12
          uv sync --project generation-backends/highdicom-pydicom --locked --no-editable --compile-bytecode --python 3.12.12
          echo "DTS_HIGHDICOM_PYTHON=$PWD/generation-backends/highdicom-pydicom/.venv/bin/python" >> "$GITHUB_ENV"
      - name: Show toolchain
        run: rustc --version && cargo --version
      - name: Check formatting and JSON artifacts
        run: |
          cargo fmt -- --check
          jq empty cases/registry.json schemas/*.json transfer-syntax/*.json standards.lock.json
      - name: Run default test suite
        run: cargo test --locked --all-targets --no-default-features
      - name: Run explicit heavy qualification once
        run: scripts/run-heavy-qualification.sh all
      - name: Check standards lock
        run: cargo run --locked --no-default-features -- standards check-lock
      - name: Exercise default profiles
        run: |
          cargo run --locked --no-default-features -- generate --profile smoke --out "$RUNNER_TEMP/dts-smoke" --seed 1
          cargo run --locked --no-default-features -- validate "$RUNNER_TEMP/dts-smoke"
          cargo run --locked --no-default-features -- generate --profile core --out "$RUNNER_TEMP/dts-core" --seed 1
          cargo run --locked --no-default-features -- validate "$RUNNER_TEMP/dts-core"
          cargo run --locked --no-default-features -- generate --profile extended --out "$RUNNER_TEMP/dts-extended" --seed 1
          cargo run --locked --no-default-features -- validate "$RUNNER_TEMP/dts-extended"
          cargo run --locked --no-default-features -- report "$RUNNER_TEMP/dts-extended" --format json > "$RUNNER_TEMP/dts-extended-report.json"
          jq -e '.counts.generated >= 108 and .counts.blocked == 0' "$RUNNER_TEMP/dts-extended-report.json"
      - name: Verify smoke reproducibility
        run: |
          cargo run --locked --no-default-features -- generate --profile smoke --out "$RUNNER_TEMP/dts-repro-a" --seed 1
          cargo run --locked --no-default-features -- generate --profile smoke --out "$RUNNER_TEMP/dts-repro-b" --seed 1
          diff -r "$RUNNER_TEMP/dts-repro-a" "$RUNNER_TEMP/dts-repro-b"
      - name: Report Nightly build cost
        if: always()
        env:
          CI_COST_ENFORCE: "0"
        run: >-
          scripts/report-ci-cost.sh nightly "$CI_DISK_BUDGET_BYTES" "$CARGO_TARGET_DIR"
          "$RUNNER_TEMP/dts-smoke" "$RUNNER_TEMP/dts-core" "$RUNNER_TEMP/dts-extended"
          "$RUNNER_TEMP/dts-extended-report.json" "$RUNNER_TEMP/dts-repro-a" "$RUNNER_TEMP/dts-repro-b"

  standalone-release:
    name: Standalone release contract
    needs: [selection, default]
    if: needs.selection.outputs.class == 'release-candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CI_DISK_BUDGET_BYTES: "17179869184"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.selection.outputs.revision }}
      - name: Initialize isolated build root and cost clock
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target-release-candidate" >> "$GITHUB_ENV"
          echo "CI_COST_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Prepare locked generation backend
        run: |
          uv python install 3.12.12
          uv sync --project generation-backends/highdicom-pydicom --locked --no-editable --compile-bytecode --python 3.12.12
          echo "DTS_HIGHDICOM_PYTHON=$PWD/generation-backends/highdicom-pydicom/.venv/bin/python" >> "$GITHUB_ENV"
      - name: Verify mandatory contract gates
        run: |
          cargo fmt --all -- --check
          git diff --check
          RUSTFLAGS='-D warnings' cargo check --locked --all-targets --no-default-features
          cargo test --locked --no-default-features --test schema_resources__subsystem product_resource_lookup_audit::
          cargo test --locked --no-default-features --test schema_resources__fast
          cargo test --locked --no-default-features --test release_ci__fast
          for module in \
            non_rust_cli_consumer caller_content_consumer qualified_catalog_consumer \
            structural_catalog_consumer upgrade_consumer release_process
          do
            cargo test --locked --no-default-features --test release_ci__nonfast "$module::"
          done
      - name: Verify packaged crate and SDK consumer
        run: |
          cargo package --locked
          PACKAGE_ROOT="$RUNNER_TEMP/package"
          mkdir -p "$PACKAGE_ROOT"
          tar -xzf "$CARGO_TARGET_DIR/package/dicom-test-suite-0.1.0.crate" -C "$PACKAGE_ROOT"
          DTS_SDK_PACKAGE_ROOT="$PACKAGE_ROOT/dicom-test-suite-0.1.0" \
            cargo test --locked --no-default-features --test release_ci__nonfast sdk_external_consumer::
      - name: Build and qualify installed archive
        env:
          DTS_RELEASE_REVISION: ${{ needs.selection.outputs.revision }}
        run: |
          TARGET=$(rustc -vV | sed -n 's/^host: //p')
          DIST="$RUNNER_TEMP/dist"
          cargo build --release --locked --target "$TARGET" --no-default-features
          BINARY="$CARGO_TARGET_DIR/$TARGET/release/dicom-test-suite"
          BINARY_SHA256=$(sha256sum "$BINARY" | awk '{print $1}')
          DTS_RELEASE_BINARY="$BINARY" \
          DTS_RELEASE_BINARY_SHA256="$BINARY_SHA256" \
          DTS_RELEASE_TARGET="$TARGET" \
            scripts/build-release-archive.sh "$TARGET" "$DIST"
          set -- "$DIST"/*.tar.gz
          [ "$#" -eq 1 ] && [ -f "$1" ] || {
            echo "expected exactly one release archive" >&2
            exit 4
          }
          ARCHIVE=$1
          ARCHIVE_SHA256=$(sha256sum "$ARCHIVE" | awk '{print $1}')
          scripts/verify-release-archive.sh "$ARCHIVE"
          EXTRACTED="$RUNNER_TEMP/extracted"
          mkdir -p "$EXTRACTED"
          tar -xzf "$ARCHIVE" -C "$EXTRACTED"
          INSTALLED_BINARY=$(find "$EXTRACTED" -path '*/bin/dicom-test-suite' -type f -print)
          [ "$(printf '%s\n' "$INSTALLED_BINARY" | sed '/^$/d' | wc -l)" -eq 1 ] || {
            echo "expected exactly one installed release binary" >&2
            exit 4
          }
          ROOT=$(dirname "$(dirname "$INSTALLED_BINARY")")
          test "$(sha256sum "$INSTALLED_BINARY" | awk '{print $1}')" = "$BINARY_SHA256"
          printf '%s\n' \
            "DTS_RELEASE_BINARY=$BINARY" \
            "DTS_RELEASE_BINARY_SHA256=$BINARY_SHA256" \
            "DTS_RELEASE_ARCHIVE=$ARCHIVE" \
            "DTS_RELEASE_ARCHIVE_SHA256=$ARCHIVE_SHA256" \
            "DTS_RELEASE_TARGET=$TARGET" \
            "DTS_RELEASE_REVISION=$DTS_RELEASE_REVISION" \
            "DTS_RELEASE_EXTRACTED_ROOT=$ROOT" >> "$GITHUB_ENV"
          python3 tests/black_box_cli_consumer.py "$INSTALLED_BINARY" "$ROOT"
          python3 tests/caller_content_consumer.py "$INSTALLED_BINARY"
          python3 tests/qualified_catalog_consumer.py "$INSTALLED_BINARY"
          python3 tests/structural_catalog_consumer.py "$INSTALLED_BINARY"
          python3 tests/upgrade_consumer.py "$INSTALLED_BINARY"
      - name: Verify archive harness and adversarial checksum fixture
        run: |
          cargo test --locked --no-default-features --test release_ci__nonfast release_archive::
      - uses: actions/upload-artifact@v7
        with:
          name: dicom-test-suite-${{ runner.os }}-${{ runner.arch }}-${{ needs.selection.outputs.revision }}
          path: ${{ runner.temp }}/dist/*
      - name: Report release-candidate build cost
        if: always()
        env:
          CI_COST_ENFORCE: "0"
        run: >-
          scripts/report-ci-cost.sh release-candidate "$CI_DISK_BUDGET_BYTES" "$CARGO_TARGET_DIR"
          "$RUNNER_TEMP/package" "$RUNNER_TEMP/dist" "$RUNNER_TEMP/extracted"

  in-process-codecs:
    name: Codec (${{ matrix.feature }})
    needs: selection
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CI_DISK_BUDGET_BYTES: "6442450944"
    strategy:
      fail-fast: false
      matrix:
        feature: [jpeg, charls, jpegxl, jpeg2000, deflate]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.selection.outputs.revision }}
      - name: Initialize isolated build root and cost clock
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target-codec-${{ matrix.feature }}" >> "$GITHUB_ENV"
          echo "CI_COST_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Compile feature-sensitive product surfaces
        run: cargo check --locked --no-default-features --features "${{ matrix.feature }}" --lib --bins
      - name: Test feature-sensitive surfaces
        run: |
          cargo test --locked --no-default-features --features "${{ matrix.feature }}" --lib codecs::tests::
          cargo test --locked --no-default-features --features "${{ matrix.feature }}" \
            --test codec__subsystem codec_backend_registry::
          cargo test --locked --no-default-features --features "${{ matrix.feature }}" \
            --test codec__subsystem frame_codec_service::
          cargo test --locked --no-default-features --features "${{ matrix.feature }}" \
            --test corpus_generation__subsystem curated_exceptional_execution::
          cargo test --locked --no-default-features --features "${{ matrix.feature }}" \
            --test cli_sdk__nonfast curated_runtime_capabilities::
          cargo test --locked --no-default-features --features "${{ matrix.feature }}" \
            --test engine__subsystem exceptional_sc_plan::
          cargo test --locked --no-default-features --features "${{ matrix.feature }}" \
            --test schema_resources__subsystem project_artifacts::
          cargo test --locked --no-default-features --features "${{ matrix.feature }}" \
            --test cli_sdk__nonfast runtime_capabilities::
      - name: Test feature-specific rejection boundary
        run: |
          case "${{ matrix.feature }}" in
            charls) regression=validate_command_reports_jpeg_ls_lossless_decoded_frame_hash_mismatch ;;
            jpegxl) regression=validate_command_reports_jpeg_xl_lossless_decoded_frame_hash_mismatch ;;
            jpeg2000) regression=validate_command_reports_jpeg_2000_lossless_decoded_frame_hash_mismatch ;;
            deflate) regression=validate_command_reports_deflated_image_frame_decoded_frame_hash_mismatch ;;
            jpeg) regression= ;;
          esac
          if [ -n "$regression" ]; then
            cargo test --locked --no-default-features --features "${{ matrix.feature }}" \
              --test cli_sdk__nonfast "validate_cli::$regression" -- --exact
          fi
      - name: Exercise feature corpus
        run: |
          root="$RUNNER_TEMP/dts-${{ matrix.feature }}"
          case "${{ matrix.feature }}" in
            jpeg) cases=(classic/sc/rgb_planar0_jpeg_baseline_8bit) ;;
            charls) cases=(classic/sc/mono2_u8_jpeg_ls_lossless) ;;
            jpegxl) cases=(classic/sc/rgb_planar0_jpegxl_lossless classic/sc/rgb_jpegxl_lossy) ;;
            jpeg2000) cases=(classic/sc/mono2_u16_jpeg2000_lossless) ;;
            deflate) cases=(classic/sc/mono2_u8_deflated_explicit_le derived/seg/binary_multiframe_deflated_image_frame) ;;
          esac
          case_args=()
          for case_id in "${cases[@]}"; do case_args+=(--case-id "$case_id"); done
          started=$SECONDS
          cargo run --locked --no-default-features --features "${{ matrix.feature }}" -- generate --profile extended "${case_args[@]}" --out "$root" --seed 1
          cargo run --locked --no-default-features --features "${{ matrix.feature }}" -- validate "$root"
          cargo run --locked --no-default-features --features "${{ matrix.feature }}" -- report "$root" --format json > "$root-report.json"
          for case_id in "${cases[@]}"; do
            jq --arg id "$case_id" -e '([.files[].case_id] + [.skipped_cases[].case_id]) | index($id) != null' "$root/manifest.json"
          done
          echo "codec_feature=${{ matrix.feature }} selected_cases=${#cases[@]} generated=$(jq '.files | length' "$root/manifest.json") skipped=$(jq '.skipped_cases | length' "$root/manifest.json") elapsed_seconds=$((SECONDS-started)) output_bytes=$(du -sk "$root" | awk '{print $1 * 1024}')"
          case "${{ matrix.feature }}" in
            jpeg) expected_ts=1.2.840.10008.1.2.4.50 ;;
            charls) expected_ts=1.2.840.10008.1.2.4.80 ;;
            jpegxl) expected_ts=1.2.840.10008.1.2.4.110 ;;
            jpeg2000) expected_ts=1.2.840.10008.1.2.4.90 ;;
            deflate) expected_ts=1.2.840.10008.1.2.8.1 ;;
          esac
          jq --arg ts "$expected_ts" -e '[.files[].dicom.transfer_syntax_uid] | index($ts) != null' "$root/manifest.json"
          if [ "${{ matrix.feature }}" = jpeg ]; then
            jq -e '.files[] | select(.case_id == "classic/sc/rgb_planar0_jpeg_baseline_8bit") | .pixel_data.encapsulated_pixel_data.fragments_per_frame == [2]' "$root/manifest.json"
          fi
          if [ "${{ matrix.feature }}" = deflate ]; then
            jq -e '.files[] | select(.case_id == "derived/seg/binary_multiframe_deflated_image_frame") | .pixel_data.native_or_encapsulated == "encapsulated" and .pixel_data.codec.backend_id == "dicom_rs_deflated_image_frame_writer" and .pixel_data.encapsulated_pixel_data.fragments_per_frame == [1,1]' "$root/manifest.json"
          fi
      - name: Report and enforce codec build cost
        if: always()
        env:
          CI_COST_ENFORCE: ${{ job.status == 'success' && '1' || '0' }}
        run: >-
          scripts/report-ci-cost.sh subsystem-codec "$CI_DISK_BUDGET_BYTES" "$CARGO_TARGET_DIR"
          "$RUNNER_TEMP/dts-${{ matrix.feature }}" "$RUNNER_TEMP/dts-${{ matrix.feature }}-report.json"

  external-codec-compile:
    name: External codec compile (${{ matrix.feature }})
    needs: selection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CI_DISK_BUDGET_BYTES: "6442450944"
    strategy:
      fail-fast: false
      matrix:
        feature: [htj2k_openjph, legacy_jpeg_dcmtk]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.selection.outputs.revision }}
      - name: Initialize isolated build root and cost clock
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/cargo-target-external-codec-${{ matrix.feature }}" >> "$GITHUB_ENV"
          echo "CI_COST_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - name: Compile and test feature-sensitive surfaces
        run: |
          cargo check --locked --no-default-features --features "${{ matrix.feature }}" --lib --bins
          cargo test --locked --no-default-features --features "${{ matrix.feature }}" --lib codecs::tests::
          cargo test --locked --no-default-features --features "${{ matrix.feature }}" \
            --test codec__subsystem codec_backend_registry::
          cargo test --locked --no-default-features --features "${{ matrix.feature }}" \
            --test codec__subsystem frame_codec_service::
          cargo test --locked --no-default-features --features "${{ matrix.feature }}" \
            --test cli_sdk__nonfast curated_runtime_capabilities::
          cargo test --locked --no-default-features --features "${{ matrix.feature }}" \
            --test engine__subsystem exceptional_sc_plan::
          cargo test --locked --no-default-features --features "${{ matrix.feature }}" \
            --test cli_sdk__nonfast runtime_capabilities::
      - name: Exercise selected external codec cases
        run: |
          root="$RUNNER_TEMP/dts-${{ matrix.feature }}"
          case "${{ matrix.feature }}" in
            htj2k_openjph) cases=(classic/sc/mono2_u16_htj2k_lossless classic/sc/mono2_u16_htj2k_lossy) ;;
            legacy_jpeg_dcmtk) cases=(classic/sc/mono2_u16_jpeg_lossless_process_14 classic/sc/mono2_u16_jpeg_lossless_sv1) ;;
          esac
          case_args=()
          for case_id in "${cases[@]}"; do case_args+=(--case-id "$case_id"); done
          started=$SECONDS
          cargo run --locked --no-default-features --features "${{ matrix.feature }}" -- generate --profile extended "${case_args[@]}" --out "$root" --seed 1
          cargo run --locked --no-default-features --features "${{ matrix.feature }}" -- validate "$root"
          for case_id in "${cases[@]}"; do
            jq --arg id "$case_id" -e '([.files[].case_id] + [.skipped_cases[].case_id]) | index($id) != null' "$root/manifest.json"
          done
          echo "codec_feature=${{ matrix.feature }} selected_cases=${#cases[@]} generated=$(jq '.files | length' "$root/manifest.json") skipped=$(jq '.skipped_cases | length' "$root/manifest.json") elapsed_seconds=$((SECONDS-started)) output_bytes=$(du -sk "$root" | awk '{print $1 * 1024}')"
      - name: Report and enforce external-codec build cost
        if: always()
        env:
          CI_COST_ENFORCE: ${{ job.status == 'success' && '1' || '0' }}
        run: scripts/report-ci-cost.sh subsystem-external-codec "$CI_DISK_BUDGET_BYTES" "$CARGO_TARGET_DIR" "$RUNNER_TEMP/dts-${{ matrix.feature }}"
