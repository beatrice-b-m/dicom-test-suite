[package]
name = "dicom-test-suite"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Synthetic DICOM corpus generator for viewer compatibility testing"
license = "MIT OR Apache-2.0"

[dependencies]
dicom-core = "=0.9.1"
dicom-dictionary-std = { version = "=0.9.0", default-features = false }
dicom-object = { version = "=0.9.1", default-features = false }
dicom-transfer-syntax-registry = { version = "=0.9.1", default-features = false }

[dev-dependencies]
serde_json = "=1.0.150"
