[package]
name = "dicom-test-suite"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic synthetic non-PHI DICOM generation and assembly toolkit"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/beatrice-b-m/dicom-test-suite"
homepage = "https://github.com/beatrice-b-m/dicom-test-suite"
documentation = "https://docs.rs/dicom-test-suite"
keywords = ["dicom", "medical-imaging", "testing", "synthetic-data"]
categories = ["command-line-utilities", "development-tools::testing"]
include = [
    ".github/workflows/ci.yml",
    "Cargo.lock",
    "CHANGELOG.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "SYSTEM_SPEC.md",
    "build.rs",
    "cases/**",
    "conformance/**",
    "conformance-backends/**",
    "docs/**",
    "examples/**",
    "generation-backends.lock.json",
    "generation-backends/**",
    "product/**",
    "schemas/**",
    "security/**",
    "src/**",
    "standards.lock.json",
    "standards/**",
    "templates/**",
    "tests/**",
    "transfer-syntax/**",
    "!**/.pytest_cache/**",
    "!**/.ruff_cache/**",
    "!**/.venv/**",
    "!**/__pycache__/**",
    "!**/*.egg-info/**",
    "!**/*.pyc",
    "!**/build/**",
]

[features]
default = []
charls = [
    "dicom-transfer-syntax-registry/charls",
]
deflate = [
    "dicom-object/deflate",
    "dicom-transfer-syntax-registry/deflate",
]
jpeg = [
    "dicom-transfer-syntax-registry/jpeg",
]
jpegxl = [
    "dicom-transfer-syntax-registry/jpegxl",
]
jpeg2000 = [
    "dicom-transfer-syntax-registry/openjp2",
    "dep:openjp2",
]
htj2k_openjph = [
    "jpeg2000",
]
legacy_jpeg_dcmtk = [
    "jpeg",
]

[dependencies]
base64 = "=0.22.1"
dicom-core = "=0.9.1"
dicom-dictionary-std = { version = "=0.9.0", default-features = false }
dicom-encoding = "=0.9.1"
dicom-object = { version = "=0.9.1", default-features = false }
dicom-parser = "=0.9.1"
dicom-transfer-syntax-registry = { version = "=0.9.1", default-features = false }
openjp2 = { version = "=0.6.1", default-features = false, features = ["std"], optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
jsonschema = { version = "0.29.1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"
