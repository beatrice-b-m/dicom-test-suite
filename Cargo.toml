[package]
name = "synth-dicom-gen"
autotests = false
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic synthetic non-PHI DICOM generation and assembly toolkit"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/beatrice-b-m/synth-dicom-gen"
homepage = "https://github.com/beatrice-b-m/synth-dicom-gen"
documentation = "https://docs.rs/synth-dicom-gen"
keywords = ["dicom", "medical-imaging", "testing", "synthetic-data"]
categories = ["command-line-utilities", "development-tools::testing"]
include = [
    ".github/workflows/ci.yml",
    "Cargo.lock",
    "CHANGELOG.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "SYSTEM_SPEC.md",
    "build.rs",
    "cases/**",
    "conformance/**",
    "conformance-backends/**",
    "docs/**",
    "examples/**",
    "generation-backends.lock.json",
    "generation-backends/**",
    "product/**",
    "schemas/**",
    "scripts/**",
    "security/**",
    "src/**",
    "standards.lock.json",
    "standards/**",
    "templates/**",
    "tests/**",
    "transfer-syntax/**",
    "!**/.pytest_cache/**",
    "!**/.ruff_cache/**",
    "!**/.venv/**",
    "!**/__pycache__/**",
    "!**/*.egg-info/**",
    "!**/*.pyc",
    "!**/build/**",
]

[features]
default = []
charls = [
    "dicom-transfer-syntax-registry/charls",
]
deflate = [
    "dicom-object/deflate",
    "dicom-transfer-syntax-registry/deflate",
]
jpeg = [
    "dicom-transfer-syntax-registry/jpeg",
]
jpegxl = [
    "dicom-transfer-syntax-registry/jpegxl",
]
jpeg2000 = [
    "dicom-transfer-syntax-registry/openjp2",
    "dep:openjp2",
]
htj2k_openjph = [
    "jpeg2000",
]
legacy_jpeg_dcmtk = [
    "jpeg",
]

[dependencies]
base64 = "=0.22.1"
dicom-core = "=0.9.1"
dicom-dictionary-std = { version = "=0.9.0", default-features = false }
dicom-encoding = "=0.9.1"
dicom-object = { version = "=0.9.1", default-features = false }
dicom-parser = "=0.9.1"
dicom-transfer-syntax-registry = { version = "=0.9.1", default-features = false }
openjp2 = { version = "=0.6.1", default-features = false, features = ["std"], optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
jsonschema = { version = "0.29.1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[[test]]
name = "assembly__nightly"
path = "tests/harnesses/assembly__nightly.rs"

[[test]]
name = "assembly__subsystem"
path = "tests/harnesses/assembly__subsystem.rs"

[[test]]
name = "cli_sdk__nonfast"
path = "tests/harnesses/cli_sdk__nonfast.rs"

[[test]]
name = "codec__nightly"
path = "tests/harnesses/codec__nightly.rs"

[[test]]
name = "codec__subsystem"
path = "tests/harnesses/codec__subsystem.rs"

[[test]]
name = "composition__nightly"
path = "tests/harnesses/composition__nightly.rs"

[[test]]
name = "composition__subsystem"
path = "tests/harnesses/composition__subsystem.rs"

[[test]]
name = "conformance_interoperability__nightly"
path = "tests/harnesses/conformance_interoperability__nightly.rs"

[[test]]
name = "conformance_interoperability__subsystem"
path = "tests/harnesses/conformance_interoperability__subsystem.rs"

[[test]]
name = "corpus_generation__nightly"
path = "tests/harnesses/corpus_generation__nightly.rs"

[[test]]
name = "corpus_generation__subsystem"
path = "tests/harnesses/corpus_generation__subsystem.rs"

[[test]]
name = "engine__nightly"
path = "tests/harnesses/engine__nightly.rs"

[[test]]
name = "engine__subsystem"
path = "tests/harnesses/engine__subsystem.rs"

[[test]]
name = "provider__subsystem"
path = "tests/harnesses/provider__subsystem.rs"

[[test]]
name = "release_ci__fast"
path = "tests/harnesses/release_ci__fast.rs"

[[test]]
name = "release_ci__nonfast"
path = "tests/harnesses/release_ci__nonfast.rs"

[[test]]
name = "schema_resources__fast"
path = "tests/harnesses/schema_resources__fast.rs"

[[test]]
name = "schema_resources__release_candidate"
path = "tests/harnesses/schema_resources__release_candidate.rs"

[[test]]
name = "schema_resources__subsystem"
path = "tests/harnesses/schema_resources__subsystem.rs"

[[test]]
name = "standards_validation__subsystem"
path = "tests/harnesses/standards_validation__subsystem.rs"
