[project]
name = "dicom-test-suite-highdicom-backend"
version = "0.1.0"
description = "Locked optional highdicom/pydicom generation backend for dicom-test-suite"
requires-python = "==3.12.12"
dependencies = [
    "highdicom==0.28.1",
    "numpy>=2.0,<3",
    "pydicom==3.0.2",
]

[project.scripts]
dts-highdicom-backend = "dts_highdicom_backend.__main__:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
python-downloads = "manual"
python-preference = "only-managed"
